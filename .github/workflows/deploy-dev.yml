# Push to feature/** -> Databricks folder switches to that branch -> app redeploys
# Merge to main      -> Databricks folder switches back to main  -> app redeploys
#
# Required GitHub settings (repo Settings > Secrets and variables > Actions):
#   Secret   DATABRICKS_TOKEN - Databricks personal access token
#   Variable DATABRICKS_HOST  - https://adb-8005091109336306.6.azuredatabricks.net
#   Variable GIT_FOLDER       - /Users/s819534@8451.com/Shashi-data-sentinel-barrows-dev
#   Variable APP_NAME         - shashi-data-sentinel-barrows
#
# Do not edit files directly inside the Databricks Git folder; uncommitted
# changes there block the branch switch. Work in VS Code on feature branches.

name: Deploy to Databricks (gbx0-dev)

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  group: databricks-app-deploy
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  GIT_FOLDER: ${{ vars.GIT_FOLDER }}
  APP_NAME: ${{ vars.APP_NAME }}
  APP_SUBPATH: data_sentinel_barrows/admin_ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Basic checks
        run: |
          python -m compileall -q data_sentinel_barrows/admin_ui
          if grep -rIE "dapi[0-9a-f]{20,}" --exclude-dir=.git . ; then
            echo "Hardcoded Databricks token found. Remove it." && exit 1
          fi

      - uses: databricks/setup-cli@main

      - name: Check connection to gbx0-dev
        run: databricks current-user me --output json | jq -r .userName

      - name: Switch Databricks folder to ${{ github.ref_name }}
        run: databricks repos update "$GIT_FOLDER" --branch "$GITHUB_REF_NAME"

      - name: Start app if stopped
        run: |
          s=$(databricks apps get "$APP_NAME" --output json | jq -r .compute_status.state)
          echo "Compute state: $s"
          [ "$s" = "ACTIVE" ] || databricks apps start "$APP_NAME" --timeout 20m

      - name: Deploy app
        run: |
          max_attempts=7
          sleep_seconds=180
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt ${attempt}/${max_attempts}"

            set +e
            deploy_output=$(databricks apps deploy "$APP_NAME" \
              --source-code-path "/Workspace${GIT_FOLDER}/${APP_SUBPATH}" --timeout 20m 2>&1)
            deploy_rc=$?
            set -e

            echo "$deploy_output"

            if [ "$deploy_rc" -eq 0 ]; then
              echo "Deployment succeeded on attempt ${attempt}."
              break
            fi

            if echo "$deploy_output" | grep -qi "pending deployment in progress"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Another deployment is still active. Waiting ${sleep_seconds}s before retry..."
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
                continue
              fi
              echo "Deployment lock did not clear in time after ${max_attempts} attempts."
              exit 1
            fi

            echo "Deploy failed for a non-retryable reason."
            exit "$deploy_rc"
          done

      - name: Result
        run: |
          databricks apps get "$APP_NAME" --output json | jq '{name, url, state: .app_status.state}'

      - name: Deployment summary
        run: |
          app_json=$(databricks apps get "$APP_NAME" --output json)
          app_url=$(echo "$app_json" | jq -r '.url // "n/a"')
          app_state=$(echo "$app_json" | jq -r '.app_status.state // "n/a"')
          compute_state=$(echo "$app_json" | jq -r '.compute_status.state // "n/a"')
          {
            echo "## Databricks App Deployment"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- App: ${APP_NAME}"
            echo "- URL: ${app_url}"
            echo "- App State: ${app_state}"
            echo "- Compute State: ${compute_state}"
          } >> "$GITHUB_STEP_SUMMARY"
