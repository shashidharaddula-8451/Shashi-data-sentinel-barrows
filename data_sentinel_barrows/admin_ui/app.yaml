# app.yaml

command: ["python", "app.py"]

env:
  - name: "DATABRICKS_HOST"
    value: "https://adb-8005091109336306.6.azuredatabricks.net"

  - name: "DATABRICKS_HTTP_PATH"
    value: "/sql/1.0/warehouses/18a5ca649627f957"

  - name: "DATABRICKS_AUTH_MODE"
    value: "pat"

  # Token is read from the app's secret resource "app_token"
  # (scope s819534-data-sentinel, key app-token). Never put the value here.
  - name: "DATABRICKS_TOKEN"
    valueFrom: "app_token"

  - name: "TARGET_CATALOG"
    value: "learning_dev"

  - name: "TARGET_SCHEMA"
    value: "s819534"

  # Lakeflow job resource key that resolves to the Agent1 job_id.
  # Configure this resource with CAN_MANAGE_RUN permission in app resources.
  - name: "DS_AGENT1_BASELINE_JOB_ID"
    valueFrom: "agent1-baseline-job"
  - name: "DS_AGENT1_VALIDATION_JOB_ID"
    valueFrom: "agent1-validation-job"

  - name: "DS_DATE_SUGGESTION_ENDPOINT"
    value: "databricks-gpt-oss-20b"

  - name: "DS_IDLE_STOP_MINUTES"
    value: "3"